import sys
import asyncio
import platform

from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "super_plateforme"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/super_plateforme
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("super_plateforme.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("super_plateforme.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

<script>
(function () {
  // Browser touch -> canvas mouse compatibility for SDL/Pygame.
  // Installed in capture phase to run before the browser's touch defaults.
  let active = null;
  function send(kind, touch) {
    const canvas = document.getElementById("canvas");
    if (!canvas || !touch) return;
    const event = new MouseEvent(kind, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY,
      screenX: touch.screenX, screenY: touch.screenY,
      button: 0, buttons: kind === "mouseup" ? 0 : 1
    });
    canvas.dispatchEvent(event);
  }
  document.addEventListener("touchstart", function (e) {
    const canvas = document.getElementById("canvas");
    if (!canvas || !e.target || e.target !== canvas) return;
    e.preventDefault();
    if (active === null && e.changedTouches.length) {
      active = e.changedTouches[0].identifier;
      canvas.focus();
      send("mousemove", e.changedTouches[0]);
      send("mousedown", e.changedTouches[0]);
    }
  }, {capture:true, passive:false});
  document.addEventListener("touchmove", function (e) {
    if (active === null) return;
    e.preventDefault();
    for (const t of e.changedTouches)
      if (t.identifier === active) { send("mousemove", t); break; }
  }, {capture:true, passive:false});
  function finish(e) {
    if (active === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === active) {
        e.preventDefault();
        send("mouseup", t);
        active = null;
        break;
      }
    }
  }
  document.addEventListener("touchend", finish, {capture:true, passive:false});
  document.addEventListener("touchcancel", finish, {capture:true, passive:false});
})();
</script>

<script>
(() => {
 const menu=document.getElementById('sp-touch-menu');
 const controls=document.getElementById('sp-touch-controls');
 const labels=['JOUER','CONTINUER','OPTIONS','MEILLEUR SCORE'];
 const keys=['j','c','o','s'];
 const canvas=()=>document.querySelector('canvas.emscripten') || document.getElementById('canvas');
 function sendKey(key,down) {
   const codes={j:'KeyJ',c:'KeyC',o:'KeyO',s:'KeyS',f:'KeyF',
     ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',' ':'Space',Escape:'Escape'};
   const code=codes[key]||key;
   const keyCode={j:74,c:67,o:79,s:83,f:70,ArrowLeft:37,ArrowRight:39,' ':32,Escape:27}[key]||0;
   const event=new KeyboardEvent(down?'keydown':'keyup',{key,code,bubbles:true,cancelable:true});
   try {Object.defineProperty(event,'keyCode',{get:()=>keyCode});Object.defineProperty(event,'which',{get:()=>keyCode});}catch(e){}
   const c=canvas();
   if(c){c.focus();c.dispatchEvent(event);}
   document.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key,code,bubbles:true,cancelable:true}));
   window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key,code,bubbles:true,cancelable:true}));
 }
 function mouseClick(x,y) {
   const c=canvas();if(!c)return;
   const r=c.getBoundingClientRect();
   const clientX=r.left+x*r.width/960,clientY=r.top+y*r.height/540;
   for(const type of ['pointermove','pointerdown','mousedown','mouseup','click','pointerup']){
     const ev=new MouseEvent(type,{bubbles:true,cancelable:true,clientX,clientY,button:0,buttons:type==='mousedown'?1:0});
     c.dispatchEvent(ev);
   }
 }
 labels.forEach((label,i)=>{
   const b=document.createElement('button');
   b.textContent=label;
   b.addEventListener('pointerdown',e=>{
     e.preventDefault();e.stopPropagation();
     mouseClick(480,242+i*68);
     sendKey(keys[i],true);
     setTimeout(()=>sendKey(keys[i],false),90);
     if(i<2){menu.style.display='none';controls.style.display='block';}
   });
   menu.appendChild(b);
 });
 function position(){
   const c=canvas();if(!c)return;
   const r=c.getBoundingClientRect();
   if(r.width<20||r.height<20)return;
   menu.style.left=r.left+'px';menu.style.top=r.top+'px';
   menu.style.width=r.width+'px';menu.style.height=r.height+'px';
   Array.from(menu.children).forEach((b,i)=>{
     b.style.left=(340/960*100)+'%';b.style.top=((215+i*68)/540*100)+'%';
     b.style.width=(280/960*100)+'%';b.style.height=(55/540*100)+'%';
   });
   controls.style.left=r.left+'px';controls.style.top=r.top+'px';
   controls.style.width=r.width+'px';controls.style.height=r.height+'px';
 }
 controls.querySelectorAll('button').forEach(b=>{
   const key=b.dataset.key;
   b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);sendKey(key,true);});
   const up=e=>{e.preventDefault();sendKey(key,false);};
   b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
 });
 setInterval(()=>{
   position();
   if(menu.dataset.started)return;
   const c=canvas();
   if(c&&c.getBoundingClientRect().width>20){menu.style.display='block';menu.dataset.started='1';}
 },600);
})();
</script>
<script>
window.spInputMessage='';window.spHeldKeys='';window.spGameState='menu';
(function(){
 const menu=document.getElementById('sp-touch-menu'),controls=document.getElementById('sp-touch-controls');
 const held=new Set();
 const command=['play','continue','options','scores'];
 [...menu.querySelectorAll('button')].forEach((b,i)=>{
  b.addEventListener('pointerdown',()=>{window.spInputMessage=command[i];},{capture:true});
 });
 controls.querySelectorAll('button').forEach(b=>{
  const map={ArrowLeft:'left',ArrowRight:'right',f:'fire',' ':'jump',Escape:'pause'};
  const key=map[b.dataset.key];
  b.addEventListener('pointerdown',()=>{
   if(key==='pause')window.spInputMessage='pause';
   else {held.add(key);window.spHeldKeys=[...held].join(',');}
  },{capture:true});
  for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>{held.delete(key);window.spHeldKeys=[...held].join(',');});
 });
 setInterval(()=>{
  const state=window.spGameState;
  if(state==='menu'){menu.style.display='block';controls.style.display='none';}
  else if(state==='play'){menu.style.display='none';controls.style.display='block';}
  else {menu.style.display='none';controls.style.display='block';}
 },200);
})();
</script></body>
